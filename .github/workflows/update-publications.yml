name: Update Publications

on:
  schedule:
    # Nightly at 04:16 UTC (off-peak minute — avoids the top-of-hour queue
    # contention that was delaying the old 04:00 UTC slot by ~5 hours)
    - cron: '16 4 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit generated files back to main
  issues: write        # needed to open/update the sync-stall alert issue

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and classify publications
        run: python3 scripts/fetch_publications.py

      - name: Commit generated files (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/publications.json \
            data/scholar.json \
            data/sync_status.json \
            assets/js/publications-data.js \
            sitemap.xml
          # Only commit when there are actual changes
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: auto-sync publications"
            git push
          fi

      - name: Alert on repeated sync failures (or auto-close a resolved alert)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FAILURES=$(python3 -c "import json; print(json.load(open('data/sync_status.json')).get('consecutive_failures', 0))")
          LAST_ERROR=$(python3 -c "import json; print(json.load(open('data/sync_status.json')).get('last_error') or '')")
          THRESHOLD=3
          TITLE="Publication sync has been failing"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)

          if [ "$FAILURES" -ge "$THRESHOLD" ]; then
            BODY="The nightly publication sync (\`update-publications.yml\`) has failed to fetch fresh data from DBLP for **$FAILURES consecutive runs**. The site is silently serving stale publication data.

          **Last error:**
          \`\`\`
          $LAST_ERROR
          \`\`\`

          This issue will auto-close once a run succeeds again."
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Sync succeeded again — closing automatically."
          fi
