# ── Scimago Q1 in a CS category ────────────────────────────────────────────
# "Q1" means Q1 in at least one Scimago COMPUTER SCIENCE sub-category.
# See: https://www.scimagojr.com/journalrank.php?area=1700
# NOTE: IEEE Access and JASIST are Q1 in broad areas but Q2/Q3 in narrow CS
# categories — they are intentionally excluded. Ask maintainer to audit.
q1_journals:
  # AI & Machine Learning
  - tnn         # IEEE Trans. Neural Networks and Learning Systems
  - tpami       # IEEE Trans. Pattern Analysis and Machine Intelligence
  - jmlr        # Journal of Machine Learning Research
  - tai         # IEEE Trans. Artificial Intelligence
  # Knowledge & Data Engineering
  - tkde        # IEEE Trans. Knowledge and Data Engineering
  - dmkd        # Data Mining and Knowledge Discovery (Springer)
  - datamine    # Data Mining and Knowledge Discovery (Springer)
  - tkdd        # ACM Trans. Knowledge Discovery from Data
  # Information Retrieval & Recommender Systems
  - tois        # ACM Trans. Information Systems
  - tors        # ACM Trans. Recommender Systems
  - ipm         # Information Processing & Management
  # Security
  - tdsc        # IEEE Trans. Dependable and Secure Computing
  - tifs        # IEEE Trans. Information Forensics and Security
  - tissec      # ACM Trans. Information and System Security
  # Databases & Systems
  - tods        # ACM Trans. Database Systems
  - tweb        # ACM Trans. Web
  - vldbj       # VLDB Journal
  # Information Science
  - isj         # Information Systems Journal
  - kais        # Knowledge and Information Systems
  # Systems & Networks
  - iot         # Internet of Things
  - tce         # IEEE Trans. Consumer Electronics
  # Magazines
  - cm          # IEEE Commun. Mag.
  # Security magazines / premium venues
  - ieeesecpriv # IEEE Security & Privacy (Scimago Q1 in Info. Systems) 

# ── Paper TITLE patterns that flag non-papers ─────────────────────────────
# Python regex, case-insensitive. Match → the entry is dropped.
skip_title_patterns:
  - "^[A-Z][A-Za-z]+ \\d{4}:"           # "ECIR 2025: Proceedings of …" prefaces
  - "\\b(editorial|preface|foreword)\\b"
  - "\\binvited\\s+(talk|paper|keynote)\\b"
  - "\\bpanel\\b"
  - "\\bworkshop\\s+(co-?chair|organiz)\\b"
  - "\\borganizing\\s+(committee|co-?chair)\\b"
  - " @ "                                # "X @ Venue" satellite-event shorthands

# ── Explicit works to drop ──────────────────────────────────────────────
# Add an OpenAlex work ID (e.g. "W2741809807") or a DOI here for invited
# talks, panels, or other one-off exclusions.
skip_keys: []

# ── Acronym → OpenAlex venue-name overrides ────────────────────────────────
# Only needed when a venue's OpenAlex source name doesn't literally contain
# its acronym. "patterns" are extra regexes tried in addition to the plain
# acronym; "exclude" (optional) vetoes a match if it also fires — used here
# only to keep 'sp' (IEEE S&P) and 'eurosp' (its European sibling) apart,
# since both source names contain "Security and Privacy".
#
# This list was built from general knowledge of standard venue naming, not
# from your actual publication data (I hit rate-limiting pulling that for
# validation) — check the "classified as 'other'" report the script prints
# on its first real run and add/fix entries here as needed.
