# data/venues.yml — Venue classification for DBLP-based publication fetch
# Key = DBLP venue abbreviation (segment after conf/ or journals/ in DBLP key)
# e.g. conf/sigir/... → sigir   |   journals/tkde/... → tkde
# Re-run scripts/fetch_publications.py after editing.

