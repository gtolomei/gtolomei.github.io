# data/venues.yml — Venue classification for OpenAlex-based publication fetch
# Key = short venue acronym (unchanged from the old DBLP-based scheme).
# Matching against a work's OpenAlex venue name works two ways:
#   1. the acronym itself, as a whole word (case-insensitive) — covers venues
#      whose OpenAlex source name literally contains the acronym (e.g. "sigir")
#   2. entries in venue_aliases below, for venues whose OpenAlex source name
#      spells the venue out instead (e.g. "icml" -> "International Conference
#      on Machine Learning") or where two acronyms could collide (sp/eurosp)
# Re-run scripts/fetch_publications.py after editing, and check its printed
# "classified as 'other'" report to catch anything still unmatched.

